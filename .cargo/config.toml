[alias]
pinny-fmt = "fmt -- --config edition=2024,hard_tabs=false,max_width=80"
pinny-clippy = "clippy --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -A clippy::multiple-crate-versions"

# Supply-chain guard: the resolver ignores registry versions published less
# than this long ago (unless already pinned in Cargo.lock). Requires cargo 1.100+.
[registry]
global-min-publish-age = "7 days"
